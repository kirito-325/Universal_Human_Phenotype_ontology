project:
  name: CellPhenoRank broad 435-disease source-label evaluation
  random_seed: 2026
  evaluation_mode: source_label_broad
inputs:
  diseases: data/benchmark/broad_source_435_v1/diseases.tsv
  models: data/benchmark/broad_source_435_v1/models.tsv
  model_phenotypes: data/benchmark/broad_source_435_v1/model_phenotypes.tsv
  similarity: ../../03_mpo_hpo_mapping/semantic_cpo_experiments/data/legacy_semantics/mpo_hpo_mapping_v31.tsv
  hpo_cpo: ../../02_phenotype_cpo_mapping/hpo_cpo/data/legacy_inputs/results/links/hpo_cpo_links.tsv.gz
  cell_markers: ../../01_cpo_construction/cell_marker_mining/marker_statistics/significant_marker_scores.tsv
  go_functions: ../../01_cpo_construction/cl_go_linking/GO_function/results/go_function_genes.tsv
  gold_standard: data/benchmark/broad_source_435_v1/gold_standard.tsv
  source_snapshot_manifest: data/benchmark/broad_source_435_v1/source_snapshot_manifest.json
  hpo_obo: ../mouse_model_prioritization/data/raw/hpo/hp.obo
  hpo_background: ../mouse_model_prioritization/data/raw/hpo/phenotype.hpoa
  legacy_output_dir: outputs/real_frozen
surface_baseline:
  method: project_bma
  matrix_release: v31_20260804
similarity:
  score_columns:
  - bi_score
  - score
  relation_factors:
    exact: 1.0
    hp_broader: 0.9
    hp_narrower: 0.8
    uncertain: 0.7
model_scoring:
  reverse_match_weight: 1.0
  bma_weight: 0.8
  max_pair_weight: 0.2
candidate_models:
  attribution_policy: single_gene_only
  multi_gene_models: excluded
reranking:
  method: cpo_enrichment_constrained
  primary_graph: strict
  run_extended_sensitivity: true
  use_continuous_hpo_cpo_weights: false
  use_marker_as_primary_evidence: false
  final_score_is_rank_display_only: true
hpo_reduction:
  remove_duplicates: true
  remove_ancestor_when_descendant_present: true
  cluster_semantic_siblings: false
  use_uniform_weights: true
cpo_graph:
  function_set_scope: go_global
  strict:
    accepted_scopes:
    - cell_type_specific
    accepted_cl_go_status:
    - supported
    - llm_supported
    - confirmed
    accepted_anatomy_status:
    - allowed
    - compatible
  extended:
    accepted_scopes:
    - cell_type_specific
    - cell_general
cpo_enrichment:
  background_scope: frozen_hpoa
  test: hypergeometric_greater
  fdr_method: fdr_bh
  fdr_used_for_ranking: false
phenotype_stability:
  method: leave_one_hpo_out
  dominance_rule: higher_rank_in_every_valid_run
  ties_create_constraint: false
  invalid_run_policy: skip
  single_hpo_policy: preserve_full_dense_order
priority_order:
- cpo_enrichment_pvalue_ascending
- supported_hpo_count_descending
- supported_cpo_count_descending
- concordant_cpo_count_descending
- raw_function_path_count_descending
- base_rank_ascending
- gene_symbol_ascending
leakage_control:
  run_practical: true
  run_bridge_loo: true
  run_indirect_only: false
benchmark:
  bootstrap_iterations: 1000
