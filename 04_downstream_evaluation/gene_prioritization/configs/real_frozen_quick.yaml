project:
  name: CellPhenoRank frozen benchmark v4 quick verification
  random_seed: 2026
  evaluation_mode: practical
inputs:
  diseases: ../mouse_model_prioritization/data/benchmark/benchmark_v4/frozen/diseases.tsv
  models: ../mouse_model_prioritization/data/benchmark/benchmark_v4/frozen/models.tsv
  model_phenotypes: ../mouse_model_prioritization/data/benchmark/benchmark_v4/frozen/model_phenotypes.tsv
  similarity: ../../03_mpo_hpo_mapping/semantic_cpo_experiments/data/legacy_semantics/mpo_hpo_mapping_v31.tsv
  hpo_cpo: ../../02_phenotype_cpo_mapping/hpo_cpo/data/legacy_inputs/results/links/hpo_cpo_links.tsv.gz
  cell_markers: ../../01_cpo_construction/cell_marker_mining/marker_statistics/significant_marker_scores.tsv
  go_functions: ../../01_cpo_construction/cl_go_linking/GO_function/results/go_function_genes.tsv
  gold_standard: ../mouse_model_prioritization/data/benchmark/benchmark_v4/frozen/gold_models.tsv
  freeze_manifest: ../mouse_model_prioritization/data/benchmark/benchmark_v4/frozen/freeze_manifest.json
similarity:
  score_columns:
  - bi_score
  - score
  relation_factors:
    exact: 1.0
    hp_broader: 0.9
    hp_narrower: 0.8
    uncertain: 0.7
hpo_cpo:
  confidence_column: geometric_consensus
  min_confidence: 0.05
  top_k_per_hpo: 25
  specific_scope_weight: 1.0
  general_scope_weight: 0.5
  require_anatomy_allowed: true
rank_fusion:
  lambda: 0.2
  coverage_mode: disease
benchmark:
  bootstrap_iterations: 200
null_models:
  enabled: true
  iterations: 20
