[project]
name = "mpo-agent"
version = "0.1.0"
description = "Model-scoped mouse MP cellular mechanism research using MGI and literature"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "deepagents==0.7.4", "langchain==1.3.14", "langchain-openai==1.4.2",
  "langchain-quickjs==0.3.5", "langchain-core>=1.5.3,<2", "pydantic>=2.12,<3",
  "httpx>=0.28,<1", "openai>=1,<3", "python-dotenv>=1.2,<2",
]

[project.scripts]
mpo-agent = "mpo_agent.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mpo_agent.upstream" = ["LICENSE"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "ruff>=0.14"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
