[project]
name = "mission3-mouse-models"
version = "0.1.0"
description = "Mechanism-aware prioritization of mouse models for rare diseases"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
mission3 = "mission3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
