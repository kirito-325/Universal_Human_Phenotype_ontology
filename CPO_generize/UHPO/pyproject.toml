[project]
name = "uhpo"
version = "0.1.0"
description = "Unified Cell Phenotype Ontology"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    "obonet",
    "scikit-learn",
    "openpyxl",
    "sentence-transformers",
    "torch",
    "transformers",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
