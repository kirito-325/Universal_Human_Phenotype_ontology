[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellphenorank"
version = "0.1.0"
description = "Auditable phenotype-to-gene ranking with cellular mechanism reranking"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
embedding = [
  "torch>=2.0",
  "transformers>=4.40",
]

[project.scripts]
cellphenorank = "cellphenorank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
