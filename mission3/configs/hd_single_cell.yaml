project:
  name: CellPhenoRank Huntington disease single-cell validation
  random_seed: 2026

inputs:
  go_functions: /path/to/workspace/CPO_generize/GO_function/results/go_function_genes.tsv

single_cell:
  disease_id: "ORPHA:399"
  candidate_gene: HTT
  evidence_paths: outputs/hd_case/reranking/evidence_paths.tsv
  datasets:
    - /path/to/workspace/mission2/data/hd_reference_processed/GSE180928_donor_celltype_pseudobulk.h5ad
    - /path/to/workspace/mission2/data/hd_reference_processed/GSE281069_donor_celltype_pseudobulk.h5ad
  dataset_ids: [GSE180928, GSE281069]
  label_map: data/cases/hd_single_cell_label_map.tsv
  cl_obo: /path/to/workspace/CPO_generize/HPO_link_v6/data/ontologies/cl.obo
  donor_column: donor_id
  condition_column: condition
  cell_type_column: harmonized_cell_type
  cell_count_column: cell_count
  disease_value: hd
  control_value: control
  min_donors_per_condition: 4
  top_functions: 5
  random_iterations: 100

