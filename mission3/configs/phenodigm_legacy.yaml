project:
  name: Archived PhenoDigm HP-MP matrix benchmark
  random_seed: 2026
  evaluation_mode: frozen_benchmark

inputs:
  diseases: /path/to/workspace/CPO_generize/mission3/data/benchmark/benchmark_v4/frozen/diseases.tsv
  models: /path/to/workspace/CPO_generize/mission3/data/benchmark/benchmark_v4/frozen/models.tsv
  model_phenotypes: /path/to/workspace/CPO_generize/mission3/data/benchmark/benchmark_v4/frozen/model_phenotypes.tsv
  gold_standard: /path/to/workspace/CPO_generize/mission3/data/benchmark/benchmark_v4/frozen/gold_models.tsv
  freeze_manifest: /path/to/workspace/CPO_generize/mission3/data/benchmark/benchmark_v4/frozen/freeze_manifest.json
  current_baseline: outputs/parameter_free/baseline/base_gene_rankings.tsv
  official_phenodigm_rankings: outputs/phenodigm_official/official/phenodigm_gene_rankings.tsv
  phenodigm_legacy_matrix: data/external/phenodigm_legacy/benchmark_v4/hp_mp_mappings.tsv.gz
  phenodigm_legacy_mpo_presence: data/external/phenodigm_legacy/benchmark_v4/candidate_mpo_presence.tsv

candidate_models:
  attribution_policy: single_gene_only

phenodigm_matrix:
  profile_mode: published_symmetric
  method_label: legacy_PhenoDigm

benchmark:
  bootstrap_iterations: 10000
