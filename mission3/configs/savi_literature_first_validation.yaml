project:
  name: SAVI STING1 literature-first reproducible case
  random_seed: 2026
  evaluation_mode: literature_first_case

inputs:
  literature_case_manifest: data/cases/savi_literature_first_case_manifest.yaml
  signature_file: /path/to/workspace/marker_literuture/database/papers/doi_10_1016_j_xcrm_2023_101333_single_cell_rna_sequencing_of_pbmcs_from_savi_pa/extracted/tables/mmc8__05_UPR_signature_used_for_Exome.csv
  a4_rankings: outputs/parameter_free_2602/reranking/extended_constrained_rankings.tsv
  a5_rankings: outputs/parameter_free_2602/bridge_loo/bridge_loo_rankings.tsv
  diseases: /path/to/workspace/CPO_generize/mission3/data/benchmark/benchmark_v4/frozen/diseases.tsv

single_cell_validation:
  minimum_genes_per_cell: 200
  maximum_genes_per_cell: 6000
  minimum_counts_per_cell: 500
  maximum_mitochondrial_fraction: 0.20
  minimum_cells_per_donor_cell_type: 20
  minimum_donors_per_condition: 4
  high_upr_control_quantile: 0.95
  highly_variable_genes: 2500
  leiden_resolution: 0.8
  primary_cell_type: monocyte
  other_major_cell_types: [naive_T, effector_T, B_cell, NK_cell, dendritic_cell]
  samples:
    - {sample_id: C10, condition: control, batch: STING2, file: data/single_cell/savi_gse226598/raw/GSM7079979_C10_raw_feature_bc_matrix.h5}
    - {sample_id: C11, condition: control, batch: STING2, file: data/single_cell/savi_gse226598/raw/GSM7079980_C11_raw_feature_bc_matrix.h5}
    - {sample_id: C1, condition: control, batch: STING3, file: data/single_cell/savi_gse226598/raw/GSM7079981_C1_raw_feature_bc_matrix.h5}
    - {sample_id: C2, condition: control, batch: STING3, file: data/single_cell/savi_gse226598/raw/GSM7079982_C2_raw_feature_bc_matrix.h5}
    - {sample_id: C7, condition: control, batch: STING1, file: data/single_cell/savi_gse226598/raw/GSM7079983_C7_raw_feature_bc_matrix.h5}
    - {sample_id: C8, condition: control, batch: STING1, file: data/single_cell/savi_gse226598/raw/GSM7079984_C8_aunt_P1_STING_raw_feature_bc_matrix.h5}
    - {sample_id: C9, condition: control, batch: STING1, file: data/single_cell/savi_gse226598/raw/GSM7079985_C9_mother_P1_STING_raw_feature_bc_matrix.h5}
    - {sample_id: P1, condition: savi, batch: STING1, file: data/single_cell/savi_gse226598/raw/GSM7079986_P1_STING_raw_feature_bc_matrix.h5}
    - {sample_id: P2, condition: savi, batch: STING1, file: data/single_cell/savi_gse226598/raw/GSM7079989_P2_STING_raw_feature_bc_matrix.h5}
    - {sample_id: P4, condition: savi, batch: STING2, file: data/single_cell/savi_gse226598/raw/GSM7079991_P4_STING_raw_feature_bc_matrix.h5}
    - {sample_id: P5, condition: savi, batch: STING3, file: data/single_cell/savi_gse226598/raw/GSM7079993_P5_STING_raw_feature_bc_matrix.h5}
    - {sample_id: P6, condition: savi, batch: STING2, file: data/single_cell/savi_gse226598/raw/GSM7079994_P6_STING_raw_feature_bc_matrix.h5}
  cell_annotation:
    markers:
      monocyte: [LST1, S100A8, S100A9, FCN1, CTSD, LGALS3, TYMP, CTSS, LILRB1]
      dendritic_cell: [FCER1A, CD1C, CLEC10A, CST3, HLA-DQA1]
      naive_T: [CD3D, CD3E, TRAC, CCR7, TCF7, LEF1, SELL, MAL]
      effector_T: [CD3D, CD3E, TRAC, CCL5, GZMK, GZMH, CTSW, PRF1]
      NK_cell: [NKG7, GNLY, KLRD1, FCGR3A, PRF1, TYROBP]
      B_cell: [MS4A1, CD79A, CD74, CD37, HLA-DRA, CD22, CD83]
      plasma_cell: [MZB1, JCHAIN, SDC1, IGHG1, DERL3]
      platelet: [PPBP, PF4, NRGN, GNG11]
  endpoint_genes:
    isr_marker: PPP1R15A
    inflammatory_module: [CCL3, CCL4, IL6]
