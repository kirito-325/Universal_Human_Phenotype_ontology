project:
  name: CellPhenoRank Huntington disease case
  random_seed: 2026
  evaluation_mode: practical

filters:
  disease_ids: ["ORPHA:399"]

inputs:
  diseases: data/cases/hd_disease_hpo.tsv
  models: /path/to/workspace/CPO_generize/mission3/data/processed/mgi_v3/models.tsv
  model_phenotypes: /path/to/workspace/CPO_generize/mission3/data/processed/mgi_v3/model_phenotypes.tsv
  similarity: /path/to/workspace/CPO_generize/MPO_HPO_mapping_v3/results/full_v31_20260804/mpo_hpo_mapping_v31.tsv
  hpo_cpo: /path/to/workspace/CPO_generize/HPO_link_v5/results/links/hpo_cpo_links.tsv.gz
  cell_markers: /path/to/workspace/marker_literuture/marker_statistics/significant_marker_scores.tsv
  go_functions: /path/to/workspace/CPO_generize/GO_function/results/go_function_genes.tsv
  gold_standard: data/cases/hd_gold.tsv

similarity:
  score_columns: [bi_score, score]

hpo_cpo:
  confidence_column: geometric_consensus
  min_confidence: 0.05
  top_k_per_hpo: 25
  general_scope_weight: 0.5

rank_fusion:
  lambda: 0.2

benchmark:
  bootstrap_iterations: 100

null_models:
  enabled: false
  iterations: 0

